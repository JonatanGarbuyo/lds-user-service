openapi: 3.1.0
info:
  title: LDS User Service API
  version: 1.0.0
  description: |
    Public HTTP contract for the LDS User Service.

    Version 1 currently covers User registration, Email Verification, web login
    with an opaque cookie session, the authenticated current User and the public
    Reader State JWKS. Bearer sessions, logout, password recovery, email change
    and administrative operations are outside this contract until their
    respective tickets are implemented.

    Registration and Email Verification never create a cookie, Bearer credential
    or session. Web login creates an opaque server-side session delivered only in
    a host-only `Secure`/`HttpOnly` cookie. `readerState.signedSnapshot` is a
    signed JWT intended exclusively for presentation: it never authenticates or
    authorizes a protected operation.

    Errors use a stable envelope with `error.code`, `error.message`,
    `error.requestId` and optional per-field messages in `error.fields`.
servers:
  - url: http://127.0.0.1:8080
    description: Local development
tags:
  - name: Identity
    description: User identity lifecycle.
  - name: Email Verification
    description: Prove control of an email address without creating a session.
  - name: Authentication
    description: Start a web session with an opaque cookie.
  - name: Reader State
    description: Public keys for verifying signed presentation snapshots. They never authorize operations.
paths:
  /v1/users:
    post:
      tags:
        - Identity
      operationId: registerUser
      summary: Register a User
      description: |
        Creates a User from an email and password, stores an Argon2id password
        hash, and returns the public User model. The User identifier is stable
        and independent from the email. Registration does not create a session,
        does not set cookies and does not issue a Bearer credential.

        Emails are trimmed and normalized to lowercase before persistence.
        Duplicate emails, including concurrent attempts, are rejected with
        `409 EMAIL_ALREADY_EXISTS`.

        Password hashing concurrency is bounded per service process to protect
        memory. When all hashing slots are busy, registration is rejected with
        `503 SERVICE_UNAVAILABLE` and a `Retry-After` header.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserRequest'
            examples:
              default:
                summary: Valid registration
                value:
                  email: person@example.com
                  password: correct horse battery
      responses:
        '201':
          description: User registered successfully.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                default:
                  summary: New active User with an unverified email
                  value:
                    id: 0f8fad5b-d9cb-469f-a165-70867728950e
                    email: person@example.com
                    emailVerified: false
                    status: active
                    createdAt: '2026-10-19T12:00:00Z'
                    updatedAt: '2026-10-19T12:00:00Z'
        '400':
          description: Malformed JSON or invalid field values.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation:
                  summary: Invalid email and password
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: The request contains invalid fields.
                      requestId: 5be2b4bb9d5d4f4fa2d3ac5f8b4cd6f1
                      fields:
                        email: must be a valid email address
                        password: must be at least 12 characters
        '409':
          description: The normalized email is already registered.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                duplicate:
                  summary: Duplicate email
                  value:
                    error:
                      code: EMAIL_ALREADY_EXISTS
                      message: An account with this email already exists.
                      requestId: 5be2b4bb9d5d4f4fa2d3ac5f8b4cd6f1
        '413':
          description: Request body exceeds the 1 MiB limit.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                tooLarge:
                  summary: Oversized body
                  value:
                    error:
                      code: PAYLOAD_TOO_LARGE
                      message: Request body is too large.
                      requestId: 5be2b4bb9d5d4f4fa2d3ac5f8b4cd6f1
        '415':
          description: Content-Type is not application/json.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unsupportedMediaType:
                  summary: Unsupported media type
                  value:
                    error:
                      code: UNSUPPORTED_MEDIA_TYPE
                      message: Content-Type must be application/json.
                      requestId: 5be2b4bb9d5d4f4fa2d3ac5f8b4cd6f1
        '500':
          description: Unexpected server failure. No internal details are exposed.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                internal:
                  summary: Internal error
                  value:
                    error:
                      code: INTERNAL_ERROR
                      message: An unexpected error occurred.
                      requestId: 5be2b4bb9d5d4f4fa2d3ac5f8b4cd6f1
        '503':
          description: Registration hashing capacity is temporarily exhausted.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                busy:
                  summary: Too many simultaneous registrations
                  value:
                    error:
                      code: SERVICE_UNAVAILABLE
                      message: Registration is temporarily unavailable.
                      requestId: 5be2b4bb9d5d4f4fa2d3ac5f8b4cd6f1
  /v1/auth/login:
    post:
      tags:
        - Authentication
      operationId: loginWithEmail
      summary: Start a web session with email and password
      description: |
        Validates the password, the account status and the configured email
        verification policy. On success it persists an opaque web session and
        delivers the session secret **only** in a host-only cookie with `Secure`,
        `HttpOnly` and `SameSite=Lax`. The JSON body never contains the session
        secret.

        The response also includes the public User, a summary of the session and
        `readerState.signedSnapshot`, a signed JWT for presentation only. The
        snapshot never authenticates or authorizes a protected endpoint; only the
        cookie does. A readable `lds_csrf` cookie and `csrfToken` are issued for
        subsequent cookie-authenticated mutations.

        Wrong passwords and unknown emails share `401 INVALID_CREDENTIALS`.
        Unverified accounts produce `403 EMAIL_NOT_VERIFIED` when
        `EMAIL_VERIFICATION_REQUIRED=true`. Suspended and deletion-requested
        accounts produce `403 ACCOUNT_SUSPENDED`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              default:
                value:
                  email: person@example.com
                  password: correct horse battery
      responses:
        '200':
          description: Web session created. The session secret is delivered only in the cookie.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                default:
                  value:
                    user:
                      id: 0f8fad5b-d9cb-469f-a165-70867728950e
                      email: person@example.com
                      emailVerified: true
                      status: active
                      createdAt: '2026-10-19T12:00:00Z'
                      updatedAt: '2026-10-19T12:03:00Z'
                    session:
                      id: 4a9c7b0e-52f2-4b4f-87e4-2b7bc9ef2c8c
                      kind: web
                      current: true
                      createdAt: '2026-10-19T12:00:00Z'
                      lastActivityAt: '2026-10-19T12:00:00Z'
                      expiresAt: '2026-11-18T12:00:00Z'
                    readerState:
                      signedSnapshot: eyJhbGciOiJFUzI1NiIsImtpZCI6ImtleS0xIiwidHlwIjoiSldUIn0.eyJpc3MiOiJsZHMtdXNlci1zZXJ2aWNlIn0.c2lnbmF0dXJl
                      expiresAt: '2026-10-19T12:30:00Z'
                    csrfToken: 9pLwXQx1tK4Lw9Vf4Qm2sA
        '400':
          description: Malformed JSON or invalid field values.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: The request contains invalid fields.
                      requestId: 5be2b4bb9d5d4f4fa2d3ac5f8b4cd6f1
                      fields:
                        email: must be a valid email address
        '401':
          description: Invalid email or password.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidCredentials:
                  value:
                    error:
                      code: INVALID_CREDENTIALS
                      message: Email or password is incorrect.
                      requestId: 5be2b4bb9d5d4f4fa2d3ac5f8b4cd6f1
        '403':
          description: Email verification is required or the account cannot sign in.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                emailNotVerified:
                  value:
                    error:
                      code: EMAIL_NOT_VERIFIED
                      message: Verify your email before signing in.
                      requestId: 5be2b4bb9d5d4f4fa2d3ac5f8b4cd6f1
                suspended:
                  value:
                    error:
                      code: ACCOUNT_SUSPENDED
                      message: This account cannot sign in.
                      requestId: 5be2b4bb9d5d4f4fa2d3ac5f8b4cd6f1
                forbiddenOrigin:
                  value:
                    error:
                      code: FORBIDDEN
                      message: Request origin is not allowed.
                      requestId: 5be2b4bb9d5d4f4fa2d3ac5f8b4cd6f1
        '413':
          description: Request body exceeds the 1 MiB limit.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Content-Type is not application/json.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many login attempts from this client IP.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server failure. No internal details are exposed.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Password hashing capacity is temporarily exhausted.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/users/me:
    get:
      tags:
        - Identity
      operationId: getCurrentUser
      summary: Get the authenticated User
      description: |
        Requires a valid web session cookie. A signed Reader State snapshot or an
        `Authorization` header never substitutes for the cookie. Missing, expired,
        revoked or unknown sessions return `401 INVALID_SESSION`.
      security:
        - cookieSession: []
      responses:
        '200':
          description: Public model of the authenticated User.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                default:
                  value:
                    id: 0f8fad5b-d9cb-469f-a165-70867728950e
                    email: person@example.com
                    emailVerified: true
                    status: active
                    createdAt: '2026-10-19T12:00:00Z'
                    updatedAt: '2026-10-19T12:03:00Z'
        '401':
          description: The session cookie is missing or no longer valid.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidSession:
                  value:
                    error:
                      code: INVALID_SESSION
                      message: A valid session is required.
                      requestId: 5be2b4bb9d5d4f4fa2d3ac5f8b4cd6f1
        '500':
          description: Unexpected server failure. No internal details are exposed.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/jwks:
    get:
      tags:
        - Reader State
      operationId: getReaderStateJWKS
      summary: Public verification keys for Reader State snapshots
      description: |
        Publishes public ECDSA P-256 verification keys. These keys are not
        credentials and cannot be used to sign new snapshots. Clients cache the
        response and revalidate with `ETag`; an unknown `kid` requires refreshing
        the key set from this trusted URL.
      security: []
      responses:
        '200':
          description: Public JWKS.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlPublic'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JWKS'
        '304':
          description: The cached key set is still current.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
  /v1/auth/email-verification/request:
    post:
      tags:
        - Email Verification
      operationId: requestEmailVerification
      summary: Request or resend an Email Verification code
      description: |
        Accepts a syntactically valid email and returns a generic `202 Accepted`
        response that is identical whether or not an account exists.

        For an existing unverified User, a new six-digit code is generated, the
        previous active code is invalidated, and an email is dispatched through
        the configured adapter. If the previous code was issued less than 60
        seconds ago, the request is accepted but no new code is sent. Verified
        accounts do not receive a new code.

        A `202` response means the request was accepted; it never asserts that an
        email was delivered. Delivery failures are logged without secrets and do
        not reveal account existence. Requests are limited to 10 per minute per
        client IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
            examples:
              default:
                summary: Request a verification code
                value:
                  email: person@example.com
      responses:
        '202':
          description: Request accepted without revealing account existence or confirming delivery.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedResponse'
              examples:
                accepted:
                  value:
                    status: accepted
        '400':
          description: Malformed JSON or an invalid email address.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: The request contains invalid fields.
                      requestId: 5be2b4bb9d5d4f4fa2d3ac5f8b4cd6f1
                      fields:
                        email: must be a valid email address
        '413':
          description: Request body exceeds the 1 MiB limit.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Content-Type is not application/json.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: More than 10 verification requests per minute from this client IP.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                rateLimited:
                  value:
                    error:
                      code: RATE_LIMITED
                      message: Too many requests. Try again later.
                      requestId: 5be2b4bb9d5d4f4fa2d3ac5f8b4cd6f1
        '503':
          description: Hashing capacity is exhausted. Retry the request later.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                busy:
                  value:
                    error:
                      code: SERVICE_UNAVAILABLE
                      message: Email verification is temporarily unavailable.
                      requestId: 5be2b4bb9d5d4f4fa2d3ac5f8b4cd6f1
        '500':
          description: Unexpected server failure. No internal details are exposed.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/auth/email-verification/confirm:
    post:
      tags:
        - Email Verification
      operationId: confirmEmailVerification
      summary: Confirm an Email Verification code
      description: |
        Confirms control of the email and sets `emailVerified=true`. The account
        `status` is not changed and no cookie, Bearer credential or session is
        created.

        Codes are single-use, valid for ten minutes and limited to five failed
        attempts. Expired, consumed, invalidated and exhausted codes all produce
        the same generic `INVALID_VERIFICATION_CODE` error so the endpoint does
        not reveal whether an account exists. Confirmation attempts are limited to
        20 per minute per client IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationConfirmRequest'
            examples:
              default:
                value:
                  email: person@example.com
                  code: '012345'
      responses:
        '200':
          description: Email verified. No credentials or session are issued.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                verified:
                  value:
                    id: 0f8fad5b-d9cb-469f-a165-70867728950e
                    email: person@example.com
                    emailVerified: true
                    status: active
                    createdAt: '2026-10-19T12:00:00Z'
                    updatedAt: '2026-10-19T12:03:00Z'
        '400':
          description: Invalid fields or an invalid, expired, consumed or exhausted code.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidCode:
                  value:
                    error:
                      code: INVALID_VERIFICATION_CODE
                      message: The verification code is invalid or has expired.
                      requestId: 5be2b4bb9d5d4f4fa2d3ac5f8b4cd6f1
                validation:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: The request contains invalid fields.
                      requestId: 5be2b4bb9d5d4f4fa2d3ac5f8b4cd6f1
                      fields:
                        code: must be exactly 6 digits
        '413':
          description: Request body exceeds the 1 MiB limit.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Content-Type is not application/json.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: More than 20 confirmation attempts per minute from this client IP.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                rateLimited:
                  value:
                    error:
                      code: RATE_LIMITED
                      message: Too many requests. Try again later.
                      requestId: 5be2b4bb9d5d4f4fa2d3ac5f8b4cd6f1
        '503':
          description: Hashing capacity is exhausted. No verification attempt is consumed.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                busy:
                  value:
                    error:
                      code: SERVICE_UNAVAILABLE
                      message: Email verification is temporarily unavailable.
                      requestId: 5be2b4bb9d5d4f4fa2d3ac5f8b4cd6f1
        '500':
          description: Unexpected server failure. No internal details are exposed.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: lds_session
      description: Opaque host-only web session. The secret is never returned in JSON.
  headers:
    XRequestId:
      description: Request correlation identifier. Echoed when a valid client value is supplied.
      schema:
        type: string
        maxLength: 128
    CacheControl:
      description: Responses containing account data must not be cached.
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: Seconds to wait before retrying a rate-limited request.
      schema:
        type: string
        example: '30'
    SetCookie:
      description: Host-only session and CSRF cookies. The session cookie is HttpOnly and Secure.
      schema:
        type: string
        example: lds_session=opaque; Path=/; HttpOnly; Secure; SameSite=Lax
    CacheControlPublic:
      description: Public verification keys may be cached by browsers and intermediaries.
      schema:
        type: string
        const: public, max-age=300
    ETag:
      description: Strong validator for conditional JWKS requests.
      schema:
        type: string
  schemas:
    RegisterUserRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Email address. Surrounding whitespace is ignored and the value is normalized to lowercase.
          example: person@example.com
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 256
          writeOnly: true
          description: Password of 12 to 256 characters. It is hashed with Argon2id and never stored or returned in plaintext.
          example: correct horse battery
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Email address. Surrounding whitespace is ignored and the value is normalized to lowercase.
          example: person@example.com
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 256
          writeOnly: true
          description: Password used to verify the stored Argon2id hash. It is never stored or returned.
          example: correct horse battery
    LoginResponse:
      type: object
      additionalProperties: false
      required:
        - user
        - session
        - readerState
        - csrfToken
      properties:
        user:
          $ref: '#/components/schemas/User'
        session:
          $ref: '#/components/schemas/SessionSummary'
        readerState:
          $ref: '#/components/schemas/ReaderStateSnapshot'
        csrfToken:
          type: string
          description: Double-submit token for subsequent cookie-authenticated mutations. It is not a session credential.
          example: 9pLwXQx1tK4Lw9Vf4Qm2sA
    SessionSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - current
        - createdAt
        - lastActivityAt
        - expiresAt
      properties:
        id:
          type: string
          description: Opaque session identifier. It never contains the session secret.
          example: 4a9c7b0e-52f2-4b4f-87e4-2b7bc9ef2c8c
        kind:
          type: string
          enum:
            - web
          example: web
        current:
          type: boolean
          description: Whether this is the session used by the current request.
          example: true
        createdAt:
          type: string
          format: date-time
          example: '2026-10-19T12:00:00Z'
        lastActivityAt:
          type: string
          format: date-time
          example: '2026-10-19T12:00:00Z'
        expiresAt:
          type: string
          format: date-time
          description: Effective expiry after applying inactivity and absolute limits.
          example: '2026-11-18T12:00:00Z'
    ReaderStateSnapshot:
      type: object
      additionalProperties: false
      required:
        - signedSnapshot
        - expiresAt
      properties:
        signedSnapshot:
          type: string
          description: Compact signed JWT for presentation only. It never authenticates or authorizes protected operations.
          example: eyJhbGciOiJFUzI1NiIsImtpZCI6ImtleS0xIiwidHlwIjoiSldUIn0.eyJpc3MiOiJsZHMtdXNlci1zZXJ2aWNlIn0.c2lnbmF0dXJl
        expiresAt:
          type: string
          format: date-time
          description: Informational expiry. Clients must validate the signed `exp` claim.
          example: '2026-10-19T12:30:00Z'
    JWKS:
      type: object
      additionalProperties: false
      required:
        - keys
      properties:
        keys:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/JWK'
    JWK:
      type: object
      additionalProperties: false
      required:
        - kty
        - crv
        - x
        - y
        - alg
        - use
        - kid
      properties:
        kty:
          type: string
          const: EC
        crv:
          type: string
          const: P-256
        x:
          type: string
          description: Base64url-encoded public X coordinate.
        y:
          type: string
          description: Base64url-encoded public Y coordinate.
        alg:
          type: string
          const: ES256
        use:
          type: string
          const: sig
        kid:
          type: string
          description: Key identifier referenced by the JWT header.
    User:
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - emailVerified
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: Stable, opaque User identifier. It is independent from the email and never changes.
          examples:
            - 0f8fad5b-d9cb-469f-a165-70867728950e
        email:
          type: string
          format: email
          description: Normalized email address.
          example: person@example.com
        emailVerified:
          type: boolean
          description: Whether the User has proven control of the email. It is set by Email Verification and is independent from the account status.
          example: false
        status:
          type: string
          description: Account status. It is independent from email verification.
          enum:
            - active
            - suspended
            - deletion_requested
          example: active
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp in RFC 3339 UTC.
          example: '2026-10-19T12:00:00Z'
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp in RFC 3339 UTC.
          example: '2026-10-19T12:00:00Z'
    EmailVerificationRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Email address. Surrounding whitespace is ignored and the value is normalized to lowercase.
          example: person@example.com
    EmailVerificationConfirmRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - code
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Email address. Surrounding whitespace is ignored and the value is normalized to lowercase.
          example: person@example.com
        code:
          type: string
          pattern: '^[0-9]{6}$'
          minLength: 6
          maxLength: 6
          description: Six-digit verification code. It is single-use and expires after ten minutes.
          example: '012345'
    AcceptedResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: accepted
          description: The request was accepted. This does not confirm email delivery.
          example: accepted
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    ErrorBody:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - requestId
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
          enum:
            - VALIDATION_ERROR
            - EMAIL_ALREADY_EXISTS
            - UNSUPPORTED_MEDIA_TYPE
            - PAYLOAD_TOO_LARGE
            - SERVICE_UNAVAILABLE
            - INVALID_VERIFICATION_CODE
            - INVALID_CREDENTIALS
            - EMAIL_NOT_VERIFIED
            - ACCOUNT_SUSPENDED
            - INVALID_SESSION
            - FORBIDDEN
            - RATE_LIMITED
            - INTERNAL_ERROR
          example: VALIDATION_ERROR
        message:
          type: string
          description: Human-readable error description. It never contains secrets.
          example: The request contains invalid fields.
        requestId:
          type: string
          description: Correlation identifier for the request.
          example: 5be2b4bb9d5d4f4fa2d3ac5f8b4cd6f1
        fields:
          type: object
          description: Optional per-field validation messages.
          additionalProperties:
            type: string
          example:
            email: must be a valid email address
